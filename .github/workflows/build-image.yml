name: build course image
on:
  push: { branches: [main], paths: ['.devcontainer/**', '.github/workflows/build-image.yml'] }
  workflow_dispatch: {}
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup && df -h / | tail -1
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: .devcontainer, push: true, tags: "ghcr.io/crazyhottommy/dataviz-course-env:latest" }
      - name: Smoke test
        run: docker run --rm ghcr.io/crazyhottommy/dataviz-course-env:latest Rscript -e 'suppressPackageStartupMessages({library(Seurat); library(ComplexHeatmap); library(Polychrome); library(presto)}); cat("R", R.version.string, "| rstudio-server:", nzchar(Sys.which("rstudio-server")), "\n")'
      - name: "RStudio serves without a login (same launch as the devcontainer, image init as PID 1)"
        run: |
          docker run -d --name rs -p 8787:8787 -e DISABLE_AUTH=true -e USER=rstudio ghcr.io/crazyhottommy/dataviz-course-env:latest
          rm -f /tmp/jar; for i in $(seq 1 45); do code=$(curl -sL --max-redirs 8 -c /tmp/jar -b /tmp/jar -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36' -o /tmp/rs.html -w '%{http_code}' http://localhost:8787/ || true); [ "$code" = "200" ] && break; sleep 2; done   # auth-none signs in via a cookie, so keep a cookie jar across redirects
          echo "HTTP $code"
          if [ "$code" = "200" ] && grep -qi 'rstudio' /tmp/rs.html && ! grep -qi 'sign in' /tmp/rs.html; then echo "RStudio page served, no login form"; else
            echo "RStudio check failed"; curl -sIL -A 'Mozilla/5.0 Chrome/124.0' http://localhost:8787/ | grep -E 'HTTP|Location'; echo "--- rserver.conf"; docker exec rs cat /etc/rstudio/rserver.conf; echo "--- logs"; docker logs rs 2>&1 | tail -30; exit 1; fi
          docker exec -u rstudio rs bash -c 'sudo -n true && echo "rstudio user can sudo"'
          docker exec rs Rscript -e 'cat("here:", requireNamespace("here", quietly=TRUE), "jsonlite:", requireNamespace("jsonlite", quietly=TRUE), "\n")'
          docker rm -f rs >/dev/null
